services:
  app:
    build: .
    ports:
      - "8080:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://my_kitchen:my_kitchen@db:5432/my_kitchen
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: my_kitchen
      POSTGRES_USER: my_kitchen
      POSTGRES_PASSWORD: my_kitchen
    volumes:
      - my-kitchen-db:/var/lib/postgresql/data

volumes:
  my-kitchen-db:
